name: Cueframe
options:
  bundleIdPrefix: com.mattbrown0406
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cueframe:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Recorder
      - Editor
      - path: Resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cueframe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Cueframe uses the camera to record your videos.
        NSMicrophoneUsageDescription: Cueframe uses the microphone to record your voice and voiceovers.
        NSPhotoLibraryUsageDescription: Cueframe imports clips from your library to edit them.
        NSPhotoLibraryAddUsageDescription: Cueframe saves your finished videos to Photos.
        NSSpeechRecognitionUsageDescription: Cueframe turns your speech into captions on your device.
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattbrown0406.cueframe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
